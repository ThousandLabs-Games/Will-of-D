name: Compilation Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# Déclaré ici car l'organisation impose la lecture seule par défaut.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restauration de la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 manquant" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/will-of-d.jks"

      - name: Compilation de l'APK signé
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/will-of-d.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nommage de l'APK
        id: apk
        run: |
          VERSION=$(grep -oP 'val versionNom = "\K[^"]+' app/build.gradle.kts)
          NOM="Will-of-D-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NOM"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version déjà publiée ?
        id: publiee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un brouillon resté d'une publication interrompue ne compte pas comme publié.
          BROUILLON=$(gh release view "v${{ steps.apk.outputs.version }}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "absente")
          if [ "$BROUILLON" = "false" ]; then
            echo "oui=true" >> "$GITHUB_OUTPUT"
          else
            echo "oui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archivage de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nom }}
          path: ${{ steps.apk.outputs.nom }}

      - name: Préparation de l'étiquette de version
        if: steps.publiee.outputs.oui == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
        run: |
          # Suppression des brouillons laissés par une publication interrompue
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "Brouillon $id supprimé"
          done
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publication de la Release
        if: steps.publiee.outputs.oui == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.nom }}
          name: Will of D ${{ steps.apk.outputs.version }}
          body_path: NOUVEAUTES.md
          draft: false
          make_latest: true

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/will-of-d.jks"
